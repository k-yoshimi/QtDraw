name: min-versions

on:
  push:
    branches: [ci/min-versions]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        pyside6: ["6.9.3", "6.10.0"]
        pyvista: ["0.45.3", "0.46.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: pyvista/setup-headless-display-action@v4
        with:
          qt: true
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-qt "PySide6==${{ matrix.pyside6 }}" "pyvista==${{ matrix.pyvista }}" "pyvistaqt==0.13.0"
          python -m playwright install --with-deps chromium
          pip list 2>/dev/null | grep -iE "^(pyside6|pyvista|pyvistaqt|vtk|numpy) "
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -p no:cacheprovider -o faulthandler_timeout=300 2>&1 | tail -30
