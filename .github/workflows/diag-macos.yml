name: diag-macos

on:
  push:
    branches: [ci/macos-diagnose]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        headless: [with-action, without-action]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Set up headless display
        if: matrix.headless == 'with-action'
        uses: pyvista/setup-headless-display-action@v4
        with:
          qt: true
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-qt
          python -m playwright install --with-deps chromium
      - name: Environment after setup
        run: env | sort | grep -viE 'token|secret' | grep -iE 'display|qt|vtk|pyvista|gl|mesa|path' || true
      - name: Steps script
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -u others/diag/macos_steps.py 2>&1
      - name: Pytest with stack dumps
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v --durations=10 -o faulthandler_timeout=120 2>&1
