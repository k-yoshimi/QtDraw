name: diag-linux

on:
  push:
    branches: [ci/linux-delete-diag]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        code: [branch, develop]
    steps:
      - uses: actions/checkout@v4
      - name: Use develop code
        if: matrix.code == 'develop'
        run: |
          git fetch -q https://github.com/CMT-MU/QtDraw.git develop
          git checkout FETCH_HEAD -- qtdraw
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: pyvista/setup-headless-display-action@v4
        with:
          qt: true
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-qt
          python -m playwright install --with-deps chromium
      - name: Run combinations
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cat > tests/test_zz_diag.py <<'PY'
          from PySide6.QtWidgets import QMessageBox


          def test_a_qtdraw_draws_then_closes(qapp, tmp_path, monkeypatch):
              from qtdraw.core.qtdraw_app import QtDraw

              monkeypatch.chdir(tmp_path)
              window = QtDraw()
              window.pyvista_widget.add_site()
              monkeypatch.setattr(QMessageBox, "question", lambda *a, **k: QMessageBox.Ok)
              window.close()


          def test_b_standalone_with_table(qapp, tmp_path, monkeypatch):
              from qtdraw.core.pyvista_widget import PyVistaWidget

              monkeypatch.chdir(tmp_path)
              for _ in range(2):
                  w = PyVistaWidget(off_screen=True)
                  w.add_site()
                  w.open_tab_group_view()
                  w.close()


          def test_c_standalone_without_table(qapp, tmp_path, monkeypatch):
              from qtdraw.core.pyvista_widget import PyVistaWidget

              monkeypatch.chdir(tmp_path)
              for _ in range(2):
                  w = PyVistaWidget(off_screen=True)
                  w.add_site()
                  w.close()
          PY
          sed -i 's/^          //' tests/test_zz_diag.py
          T=tests/test_zz_diag.py
          run() {
            set +e
            timeout 300 python -m pytest -q -p no:cacheprovider "$@" > out.txt 2>&1
            code=$?
            set -e
            echo "===== $*: exit $code, GL errors $(grep -c 'color attachment' out.txt), $(grep -E 'passed|failed' out.txt | tail -1)"
          }
          run "$T::test_a_qtdraw_draws_then_closes" "$T::test_b_standalone_with_table"
          run "$T::test_a_qtdraw_draws_then_closes" "$T::test_c_standalone_without_table"
          run "$T::test_b_standalone_with_table"
